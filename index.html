<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Golden Acorns of Maple Hollow Farm · Thanksgiving Escape Room</title>
<meta name="description" content="A Thanksgiving digital escape room for 3rd grade.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌰</text></svg>">
<style>
:root{--cream:#FFF6E9;--paper:#FFFDF8;--line:#EBD6B8;--brown:#3E2614;--brown2:#7A5232;--pumpkin:#E0762B;--pumpkin-d:#B4571A;--gold:#E8B53A;--gold-d:#B98A1C;--cran:#A3303F;--sage:#5F7F3F;--sage-l:#EEF5E6}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Nunito","Segoe UI Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,-apple-system,sans-serif;font-size:20px;line-height:1.45;color:var(--brown);
  background:#2B1A10 radial-gradient(ellipse at 50% 0%, #5A3A22 0, #2B1A10 70%) fixed;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:4px solid #5BA4FF;outline-offset:2px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto;padding:8px 16px;color:#FFEBD0}
.brand{font-weight:900;font-size:19px;display:flex;align-items:center;gap:10px;letter-spacing:.2px}
.brand small{display:block;font-weight:700;opacity:.65;font-size:13px}
.tracker{display:flex;gap:7px}
.slot{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px dashed rgba(255,235,208,.35);position:relative;font-size:19px;background:rgba(255,255,255,.04)}
.slot .slot-ic{opacity:.45;filter:grayscale(.7)}
.slot.got{border:2px solid #FFE08A;background:radial-gradient(circle,#7A5410,#3a2408);box-shadow:0 0 14px rgba(247,205,69,.6)}
.slot.got .slot-ic{opacity:0}
.slot .slot-acorn{position:absolute;inset:2px}
.slot .slot-acorn svg{width:100%;height:100%}
.slot.here{border:2px solid #FFB27A;animation:ringp 1.6s infinite}
.slot.pop{animation:slotpop .6s cubic-bezier(.2,1.8,.4,1)}
.hdr-tools{display:flex;gap:8px}
.hdr-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,235,208,.25);color:#FFEBD0;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}

/* stage */
#stageWrap{position:relative;width:min(calc(100% - 24px), calc(56vh * 2.2222), 1180px);margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 4px #6B4528,0 0 0 8px #3a2414}
#stage{display:block;width:100%;height:auto;aspect-ratio:1200/540;background:#9FD3F0}
#wipe{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle,#2B1A10 0,#2B1A10 60%,transparent 61%);background-size:0 0;background-position:center;background-repeat:no-repeat}
#wipe.go{animation:wipe .75s ease-in-out}
@keyframes wipe{0%{background-size:0 0}45%,55%{background-size:300% 300%}100%{background-size:0 0;opacity:0}}

/* panel */
#panel{max-width:1180px;margin:16px auto 10px;padding:0 12px}
#panel.in>*{animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.dlg{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(#FFFDF8,#FFF4E2);border:4px solid #C89B62;border-radius:22px;padding:16px 20px;box-shadow:0 6px 0 #7A5232,0 12px 24px rgba(0,0,0,.3)}
.portrait{flex:none;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF3D6,#F2D3A0);border:4px solid #C89B62;overflow:hidden;box-shadow:inset 0 -6px 0 rgba(0,0,0,.06)}
.portrait svg{width:100%;height:100%}
.dlg-body{flex:1;min-width:0}
.dlg-name{display:inline-block;background:var(--pumpkin);color:#fff;font-weight:900;font-size:16px;letter-spacing:.5px;padding:2px 14px;border-radius:999px;margin-bottom:6px;text-transform:uppercase}
.dlg-text{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;font-size:23px;font-weight:600}
.dlg-text>span{padding-top:4px}
.dlg-actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap}
.namebox input{font:inherit;font-size:28px;font-weight:800;padding:10px 16px;border:3px solid var(--line);border-radius:14px;width:min(360px,100%);margin:0 0 12px 56px;color:var(--brown)}
.titlecard{text-align:center;color:#FFEBD0;margin:-4px 0 12px}
.titlecard h1{margin:0;font-size:38px;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.tc-kicker{font-weight:800;font-size:16px;letter-spacing:1px;text-transform:uppercase;opacity:.75}
.roomtag{display:flex;align-items:center;gap:10px;color:#FFEBD0;font-weight:900;font-size:22px;margin:0 0 10px 6px}
.rt-icon{font-size:26px}
.rt-skill{font-size:14px;font-weight:800;background:rgba(255,255,255,.12);border:1px solid rgba(255,235,208,.3);padding:2px 12px;border-radius:999px}
.acornbanner{display:flex;align-items:center;gap:10px;justify-content:center;color:#FFE08A;font-weight:900;font-size:26px;margin-bottom:10px;text-shadow:0 2px 0 rgba(0,0,0,.4);animation:glowtxt 1.5s ease-in-out infinite alternate}

/* say buttons */
.say{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--pumpkin);background:#fff;color:var(--pumpkin-d);display:grid;place-items:center;padding:0;transition:transform .12s;box-shadow:0 3px 0 #E9C9A6}
.say:hover{transform:scale(1.08)}
.say.speaking{background:var(--pumpkin);color:#fff;animation:ringp 1.1s infinite}
.say-big{width:auto;border-radius:999px;padding:6px 16px 6px 10px;gap:6px;display:inline-flex;align-items:center;font-weight:800;font-size:16px}
.say.mini{width:36px;height:36px;border-width:2px;box-shadow:none}
.say.mini svg{width:18px;height:18px}

/* buttons */
.btn{background:linear-gradient(#F08A3E,#DC6E22);color:#fff;border:none;border-radius:16px;padding:13px 26px;font-size:21px;font-weight:900;box-shadow:0 6px 0 var(--pumpkin-d),0 10px 16px rgba(0,0,0,.18);transition:transform .08s;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pumpkin-d)}
.btn:disabled{background:#CDBBA5;box-shadow:0 6px 0 #A8957E;cursor:not-allowed;filter:none}
.btn.green{background:linear-gradient(#77A050,#5A7E38);box-shadow:0 6px 0 #3E5A24,0 10px 16px rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--brown2);border:3px solid var(--line);box-shadow:0 4px 0 var(--line);text-shadow:none}
.btn.small{font-size:16px;padding:7px 14px}

/* question card */
.qcard{background:linear-gradient(#FFFDF8,#FFF4E2);border:4px solid #C89B62;border-radius:22px;padding:16px 20px 20px;box-shadow:0 6px 0 #7A5232,0 12px 24px rgba(0,0,0,.3)}
.qhead{display:flex;gap:14px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.qhead .portrait{width:64px;height:64px;border-width:3px}
.qmeta{flex:1;min-width:180px}
.qwhere{font-weight:900;font-size:18px;color:var(--brown2)}
.qnum{font-weight:800;font-size:15px;opacity:.7}
.qpips{display:flex;gap:5px;margin-top:4px}
.qpips span{width:22px;height:8px;border-radius:4px;background:#EADBC6}
.qpips span.done{background:var(--sage)}.qpips span.now{background:var(--pumpkin)}
.qtools{display:flex;gap:8px;flex-wrap:wrap}
.qprompt{display:flex;gap:12px;align-items:flex-start;font-size:25px;font-weight:800;margin:6px 0 16px}
.qprompt>span{padding-top:4px}

/* number work + keypad */
.numrow{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.colmath{display:grid;grid-template-columns:44px repeat(var(--cols),64px);gap:6px 8px;align-items:center;justify-items:center;background:#24402E;border:8px solid #8A5A31;border-radius:14px;padding:12px 18px 16px;box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.cm-label{font-size:12px;font-weight:800;color:#CFE3C0;text-transform:uppercase;letter-spacing:.5px}
.cm-dig{font-family:"Comic Sans MS","Chalkboard SE","Segoe Print",cursive;font-size:48px;line-height:1;color:#FBFBF2;font-weight:700}
.cm-op{font-size:44px;color:#FBFBF2;font-weight:700}
.cm-bar{grid-column:1/-1;width:100%;height:5px;background:#FBFBF2;border-radius:3px;opacity:.9}
.cm-box{width:60px;height:66px;border-radius:12px;border:3px dashed #9FC28F;background:rgba(255,255,255,.06);color:#FFE08A;font-size:44px;font-weight:900;font-family:"Comic Sans MS","Chalkboard SE",cursive;padding:0}
.cm-box.scratch{width:44px;height:40px;font-size:24px;border-color:rgba(159,194,143,.5);color:#F7B2B2}
.cm-box.active{border-style:solid;border-color:#FFE08A;box-shadow:0 0 0 4px rgba(255,224,138,.35);animation:caret 1s steps(2) infinite}
.cm-box.ok{border-color:#9FE07A;color:#B6F28E;border-style:solid}
.lockdisplay{display:flex;gap:10px;background:#1F2A22;border:8px solid #6C7884;border-radius:16px;padding:14px 18px;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
.cm-box.big{width:70px;height:84px;font-size:52px;font-family:"Courier New",monospace;color:#7CF29A;border-color:#3d5a45}
.cm-box.big.active{border-color:#7CF29A;box-shadow:0 0 0 4px rgba(124,242,154,.25)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;background:linear-gradient(#8A5A31,#6B4528);padding:14px;border-radius:20px;box-shadow:0 6px 0 #3E2614}
.key{height:62px;border-radius:14px;border:none;background:linear-gradient(#FFFDF6,#F0E2C8);font-size:30px;font-weight:900;color:var(--brown);box-shadow:0 5px 0 #B99D75}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #B99D75}
.key:disabled{opacity:.5}
.key-back{background:linear-gradient(#FFE4D0,#F5C9A6)}
.key-ok{background:linear-gradient(#9CD27A,#6FAE4A);color:#fff;box-shadow:0 5px 0 #3E6A24}

/* choices */
.choices{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.crow{display:flex;gap:10px;align-items:center}
.choice{flex:1;min-height:76px;text-align:left;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px 16px;font-size:21px;font-weight:700;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 #E3CBA6;transition:transform .12s,border-color .12s}
.choice:hover:not(:disabled){transform:translateY(-3px);border-color:var(--pumpkin)}
.choice .letter{flex:none;width:40px;height:40px;border-radius:50%;background:#F6E3C6;display:grid;place-items:center;font-weight:900}
.choice.tried{opacity:.55;border-color:#E4AAAA;background:#FDF2F2;box-shadow:0 5px 0 #EBC5C5}
.choice.tried .letter{background:#F1CACA}
.choice.right{border-color:var(--sage);background:var(--sage-l);box-shadow:0 5px 0 #A9C78E;animation:bounce .5s}
.choice.right .letter{background:var(--sage);color:#fff}
.choice:disabled{cursor:default}
.theme-orchard .choice .letter{background:radial-gradient(circle at 35% 35%,#FF8A7A,#C9282E);color:#fff}
.theme-bog .choice .letter{background:radial-gradient(circle at 35% 35%,#9FD9A0,#4E8A4A);color:#fff}
.theme-maze .choice{background:linear-gradient(#FFF8E6,#F7E9C8)}
.theme-maze .choice .letter{background:#E2BE52}
.theme-shed .choice .letter{background:#7A1F2A;color:#F7D57A}

/* ordering */
.ohelp{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:700;opacity:.85;margin:0 0 10px}
.opool{display:flex;flex-wrap:wrap;gap:10px;min-height:70px;padding:10px;border:3px dashed var(--line);border-radius:16px;background:#FFF9EE;margin-bottom:14px}
.opool.empty::after{content:"All cards placed! Check your order.";opacity:.55;font-weight:700;align-self:center;margin:auto}
.ocard{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #D9B98E;border-radius:14px;padding:8px 8px 8px 10px;font-size:19px;font-weight:700;box-shadow:0 4px 0 #D9B98E;cursor:grab;touch-action:none;user-select:none;max-width:100%}
.ocard .grip{color:#C9A97E;font-weight:900;letter-spacing:-3px}
.ocard .otext{flex:1}
.ocard.sel{border-color:var(--pumpkin);box-shadow:0 0 0 4px rgba(224,118,43,.3),0 4px 0 var(--pumpkin-d);transform:translateY(-2px)}
.ocard.dragging{opacity:.35}
.ocard.ghost{position:fixed;z-index:200;pointer-events:none;transform:rotate(-2deg) scale(1.03);box-shadow:0 14px 26px rgba(0,0,0,.3);opacity:.95}
.ocard.ok{border-color:var(--sage);box-shadow:0 4px 0 #A9C78E;background:var(--sage-l)}
.oslots{display:grid;gap:10px}
.oslot{display:flex;align-items:center;gap:12px;min-height:66px;border-radius:16px;background:#F4E6CF;border:3px solid #E3CBA6;padding:6px 8px;cursor:pointer;transition:background .15s}
.oslot .onum{flex:none;width:44px;height:44px;border-radius:50%;background:var(--brown2);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.oslot .ohold{flex:1;min-height:50px;border:2px dashed #D3B994;border-radius:12px;display:flex}
.oslot .ohold:empty::after{content:"Drop a card here";opacity:.4;font-weight:700;font-size:16px;margin:auto}
.oslot.full .ohold{border:none}
.oslot.full .ocard{flex:1}
.oslot.hover{background:#FFE3C4;border-color:var(--pumpkin)}
.oslot.ok .onum{background:var(--sage)}
.oactions{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}

/* feedback */
.feedback{display:none;margin-top:16px;border-radius:18px;padding:12px 16px}
.feedback.show{display:block;animation:pop .3s ease-out}
.feedback.wrong{background:#FFF1E4;border:3px solid #F3C49B}
.feedback.right{background:var(--sage-l);border:3px solid #B9D19C;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.feedback.neutral{background:#F4EFE7;border:3px solid var(--line)}
.fb-row{display:flex;gap:12px;align-items:flex-start}
.fb-head{font-weight:900;font-size:22px}
.fb-hint{font-size:20px;font-weight:600;margin-top:2px}
.fb-tip{display:flex;gap:10px;align-items:center;font-size:17px;margin:10px 0 0}

/* reader overlay */
#overlay{position:fixed;inset:0;z-index:100;background:rgba(30,16,8,.72);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .25s}
#overlay[hidden]{display:none}
.book-wrap{position:relative;width:min(1150px,100%);max-height:100%;perspective:1800px}
.book{display:grid;grid-template-columns:1fr 1fr;background:#7A1F2A;border-radius:18px;padding:14px;box-shadow:0 24px 50px rgba(0,0,0,.5);max-height:calc(100vh - 28px);overflow:auto}
.book.scroll{background:#8A5A31}
.page{background:#FFF9EC;min-height:420px;padding:18px}
.page-l{border-radius:10px 0 0 10px;display:flex;align-items:center;box-shadow:inset -18px 0 24px -16px rgba(0,0,0,.25)}
.page-l svg{width:100%;height:auto;border-radius:10px;border:3px solid #E8D6B4}
.page-r{border-radius:0 10px 10px 0;display:flex;flex-direction:column;box-shadow:inset 18px 0 24px -16px rgba(0,0,0,.25)}
.book.scroll .page{background:#FBF2DC}
.pg-kind{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--cran);margin-bottom:8px}
.pg-title{display:flex;gap:10px;align-items:center;margin:0 0 10px;font-size:24px}
.pg-para{display:flex;gap:12px;align-items:flex-start;font-size:22px;line-height:1.5;margin:0 0 14px;font-family:Georgia,"Times New Roman",serif}
.storybook .pg-para{font-size:26px}
.pg-para>span{padding-top:2px}
.pg-all{margin-bottom:10px}
.pg-nav{margin-top:auto;display:flex;justify-content:space-between;gap:10px;padding-top:10px}
.book-x{position:absolute;top:-12px;right:-12px;z-index:3;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:var(--cran);color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.book.flip-r .page-r,.book.flip-l .page-l{animation:flip .55s ease-out}
.book.flip-r .page-l,.book.flip-l .page-r{animation:fade .5s ease-out}
@keyframes flip{from{transform:rotateY(-70deg);opacity:.2;transform-origin:left center}to{transform:none;opacity:1}}

/* certificate */
.cert{background:#FFFBEF;border:8px double var(--gold-d);border-radius:24px;padding:22px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.cert-acorns{display:flex;justify-content:center;gap:4px}
.cert-kicker{font-size:22px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--brown2);margin-top:6px}
.cert-name{font-size:52px;font-weight:900;color:var(--cran);border-bottom:3px solid var(--line);display:inline-block;min-width:60%;line-height:1.2}
.cert-line{font-size:21px;font-weight:700;margin:10px 0}
.cert-skills{list-style:none;padding:0;margin:8px auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:800px}
.cert-skills li{background:#F6E3C6;border-radius:999px;padding:4px 14px;font-size:16px;font-weight:800}
.cert-date{font-size:16px;opacity:.75;margin:8px 0 0}
.cert-show{display:flex;gap:10px;align-items:center;justify-content:center;font-weight:900;color:var(--cran);font-size:20px;margin:10px 0 0}

footer{max-width:1180px;margin:0 auto 24px;padding:0 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:#C9A97E;font-size:14px}
footer button{background:none;border:none;color:#C9A97E;text-decoration:underline;padding:0;font-size:14px}

/* fx */
.leaf{position:fixed;top:-60px;pointer-events:none;z-index:150;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(600deg)}}
.spark{position:fixed;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:160;animation:spark .75s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.flyer{position:fixed;width:100px;height:100px;z-index:170;pointer-events:none;transition:left 1s cubic-bezier(.5,-.3,.6,1),top 1s cubic-bezier(.3,.6,.4,1),transform 1s}
.flyer svg{width:100%;height:100%}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes ringp{0%,100%{box-shadow:0 0 0 0 rgba(255,178,122,.6)}50%{box-shadow:0 0 0 9px rgba(255,178,122,0)}}
@keyframes slotpop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes caret{50%{background:rgba(255,224,138,.15)}}
@keyframes glowtxt{from{text-shadow:0 0 6px rgba(247,205,69,.3)}to{text-shadow:0 0 18px rgba(247,205,69,.9)}}

/* ===== SVG scene animation ===== */
#stage .bob{animation:bob 2.6s ease-in-out infinite}
#stage .char .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
#stage .char .mouth,.portrait .mouth{transform-box:fill-box;transform-origin:50% 0}
.char.talking .mouth{animation:talk .19s ease-in-out infinite alternate}
.char.talking .bob{animation:bobtalk .55s ease-in-out infinite}
#stage .pip-tail{transform-box:fill-box;transform-origin:50% 100%;animation:fan 3.2s ease-in-out infinite}
#stage .wingL{transform-box:fill-box;transform-origin:100% 10%}
#stage .wingR{transform-box:fill-box;transform-origin:0% 10%}
#stage .wattle{transform-box:fill-box;transform-origin:50% 0;animation:swing 2s ease-in-out infinite}
.cheer .bob,.cheer-loop .bob,.cheer .bob-water,.cheer .breathe,.cheer-loop .breathe,.cheer-loop .bob-water{animation:hop .45s ease-out infinite !important}
.cheer .wingL,.cheer-loop .wingL{animation:flapL .18s infinite alternate}
.cheer .wingR,.cheer-loop .wingR{animation:flapR .18s infinite alternate}
.cheer .sway-slow{animation:wiggle .3s infinite alternate}
.cheer-soft .breathe{animation:hop .9s ease-out infinite}
.oops .bob,.oops .owl-head,.oops .sway-slow,.oops .bob-water,.oops .head{animation:nope .14s 4 !important;transform-box:fill-box;transform-origin:50% 100%}
.panic .bob{animation:panic .12s infinite !important}
.panic .pip-tail{animation:fanfast .2s infinite alternate}
.strain .bob{animation:panic .2s infinite !important}
#stage .legL,#stage .legR{transform-box:fill-box;transform-origin:50% 0}
.walking .legL{animation:stepA .32s ease-in-out infinite alternate}
.walking .legR{animation:stepB .32s ease-in-out infinite alternate}
.walking .bob{animation:walkbob .32s ease-in-out infinite alternate}
#stage .sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}

/* ===== NO-SCROLL APP LAYOUT (Chromebook first) ===== */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;font-size:19px}
header{flex:none;width:100%;max-width:1560px;padding:5px 14px;min-height:50px}
.brand{font-size:17px}.brand>span{font-size:26px!important}
.slot{width:38px;height:38px;font-size:17px}
#app{flex:1;min-height:0;width:100%;max-width:1560px;margin:0 auto;padding:0 12px 10px;display:grid;gap:10px}
#stageWrap{container-type:size;min-height:0;min-width:0;width:auto;margin:0;border-radius:0;overflow:visible;box-shadow:none;display:flex;align-items:center;justify-content:center}
.stageBox{position:relative;width:min(100cqw, calc(100cqh * 2.2222));aspect-ratio:1200/540;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 0 4px #6B4528,0 0 0 7px #3a2414}
#stage{width:100%;height:100%;aspect-ratio:auto}
#banner{position:absolute;left:0;right:0;top:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s}
#banner.show{opacity:1}
#banner.title{padding:14px 0 30px;background:linear-gradient(rgba(43,26,16,.78),rgba(43,26,16,0));color:#FFEBD0}
#banner.title h1{margin:0;font-size:clamp(24px,3.4cqw,42px);line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#banner.acornb{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px 0 26px;background:linear-gradient(rgba(43,26,16,.7),rgba(43,26,16,0));color:#FFE08A;font-weight:900;font-size:26px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#banner.acornb.show{opacity:1;animation:glowtxt 1.5s ease-in-out infinite alternate}
#panel{margin:0;padding:0;max-width:none;min-height:0}

/* story mode: big stage + compact dialogue bar */
.mode-story #app{grid-template-rows:minmax(0,1fr) auto}
.mode-story #panel{width:100%;max-width:1180px;justify-self:center}
.dlg{padding:10px 16px;gap:14px;align-items:center;border-width:3px;box-shadow:0 5px 0 #7A5232,0 8px 18px rgba(0,0,0,.3)}
.dlg .portrait{width:78px;height:78px}
.dlg-name{font-size:14px;padding:1px 12px;margin-bottom:4px}
.dlg-text{font-size:21px;margin:0 0 8px;gap:10px}
.dlg-actions .btn{padding:9px 22px;font-size:19px}
.namebox input{font-size:24px;padding:6px 14px;margin:0 0 8px 56px}
.roomtag{display:none}

/* question mode: scene + question on the left, answering tools on the right */
.mode-q #app{grid-template-columns:minmax(0,1fr) clamp(500px,45vw,700px);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage right" "left right"}
.mode-q #panel{display:contents}
.mode-q #stageWrap{grid-area:stage}
.qcard{border-width:3px;box-shadow:0 5px 0 #7A5232,0 8px 18px rgba(0,0,0,.3);padding:10px 14px;border-radius:18px}
.mode-q .qleft{grid-area:left;min-height:0;overflow:auto;display:flex;flex-direction:column}
.mode-q .qright{grid-area:right;min-height:0;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.qhead{margin-bottom:4px;gap:10px;flex-wrap:nowrap}
.qhead .portrait{width:50px;height:50px}
.qwhere{font-size:16px}.qnum{font-size:13px}
.qpips span{width:18px;height:7px}
.qprompt{font-size:21px;margin:4px 0 6px;gap:10px;line-height:1.3}
.qprompt .say,.fb-row .say{width:40px;height:40px}
.feedback{margin-top:6px;padding:8px 12px;border-radius:14px}
.feedback.right{padding:8px 12px}
.feedback.right .btn{padding:9px 20px;font-size:19px}
.fb-head{font-size:19px}.fb-hint{font-size:18px}.fb-tip{font-size:15px;margin-top:6px}
.btn.small{font-size:15px;padding:6px 12px}
/* keypad + column math */
.numrow{gap:16px;flex-wrap:nowrap;align-items:center}
.colmath{grid-template-columns:34px repeat(var(--cols),56px);gap:4px 6px;padding:8px 12px 10px;border-width:7px}
.cm-label{font-size:11px}
.cm-dig{font-size:40px}.cm-op{font-size:36px}
.cm-box{width:52px;height:56px;font-size:36px}
.cm-box.scratch{width:40px;height:34px;font-size:21px}
.cm-box.big{width:64px;height:76px;font-size:46px}
.keypad{grid-template-columns:repeat(3,66px);gap:8px;padding:10px;border-radius:16px}
.key{height:54px;font-size:26px}
/* choices */
.qtype-mc .choices{grid-template-columns:1fr;gap:10px}
.choice{min-height:62px;font-size:20px;padding:8px 14px;border-radius:16px}
.choice .letter{width:36px;height:36px}
.crow .say{width:40px;height:40px}
/* ordering */
.qtype-order{justify-content:flex-start!important}
.ohelp{font-size:15px;margin:0 0 6px}.ohelp .say{width:34px;height:34px}
.opool{min-height:52px;padding:6px;gap:6px;margin-bottom:8px;border-radius:14px}
.ocard{font-size:17px;padding:5px 6px 5px 8px;border-radius:12px;gap:6px;box-shadow:0 3px 0 #D9B98E}
.ocard .say.mini{width:30px;height:30px}.ocard .say.mini svg{width:15px;height:15px}
.oslots{gap:6px}
.oslot{min-height:50px;padding:4px 6px;border-radius:14px;gap:8px}
.oslot .onum{width:34px;height:34px;font-size:18px}
.oslot .ohold{min-height:40px}
.oslot .ohold:empty::after{font-size:14px}
.oactions{margin-top:8px}
.oactions .btn{padding:8px 18px;font-size:18px}
/* reader + certificate fit */
.book{max-height:calc(100dvh - 24px);grid-template-columns:1.05fr 1fr;padding:10px}
.page{min-height:0;padding:14px;overflow:auto}
.pg-para{font-size:20px;margin-bottom:10px}.storybook .pg-para{font-size:24px}
.pg-title{font-size:21px}
.cert{padding:12px 16px}.cert-name{font-size:40px}.cert-line{font-size:18px;margin:6px 0}.cert-kicker{font-size:18px}.cert-skills li{font-size:14px;padding:2px 10px}.cert-acorns svg{width:30px;height:30px}

.qright>*{flex-shrink:0}
.owrap{display:grid;grid-template-columns:1fr 1.1fr;gap:10px;align-items:start}
.olabel{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:var(--brown2);margin:0 0 4px 4px}
.owrap .opool{flex-direction:column;flex-wrap:nowrap;margin:0;min-height:100%}
.owrap .opool .ocard{width:100%}
.owrap .opool.empty::after{content:"All placed!"}
.owrap.allplaced{grid-template-columns:1fr}
.owrap.allplaced .ocol:first-child{display:none}
.ocard .otext{line-height:1.2}
@media (max-height:630px){
  .ocard{font-size:15px;padding:3px 5px 3px 7px}.ocard .say.mini{width:26px;height:26px}

  .ohelp{display:none}
  .qprompt{font-size:19px}.dlg-text{font-size:19px}.dlg .portrait{width:64px;height:64px}
  .key{height:48px}.cm-box{height:50px}.cm-dig{font-size:36px}
}
/* taller screens: give story text a little more room */
@media (min-height:820px){ .dlg-text{font-size:23px} .qprompt{font-size:23px} }
/* small or portrait screens: fall back to normal scrolling page */
@media (max-width:900px), (max-height:500px){

  .mode-q #panel{display:block}
  .qcard{margin-top:10px}
  .numrow{flex-wrap:wrap}
}

ped the ones. Now check the tens: 8 + 4 + 1. Is that more than 9?", "424": "Look at the ones: 9 + 5 is more than 9. Did you regroup that ten?", "144": "This is an addition problem. Make sure you are adding, not subtracting."}, "hints": ["Start with the ones: 9 + 5. Regroup if the sum is more than 9.", "In the tens column, add the tens AND any regrouped ten.", "This one needs regrouping two times. Go slowly, one column at a time."], "a": "NDM0"}, {"type": "num", "prompt": "Pip's family planted 407 pumpkin seeds in spring and 296 more in summer. How many seeds did they plant altogether?", "stack": ["407", "296", "+"], "errs": {"693": "Look at the ones: 7 + 6 is more than 9. Regroup! Then check the tens column too.", "603": "Look at the tens: 0 + 9 + 1 makes 10 tens. 10 tens is the same as 1 hundred. Regroup again!", "111": "\"Altogether\" means we add the groups together."}, "hints": ["\"Altogether\" means add.", "Start with the ones: 7 + 6. Is it more than 9?", "Watch out! When the tens column makes 10 tens, that's 1 hundred. Regroup it to the hundreds."], "a": "MzA3"}]}, {"id": "maze", "title": "The Corn Maze", "icon": "🌽", "skill": "Forces and motion", "intro": ["The Corn Maze is tall and twisty. At every turn, a talking scarecrow named Scraps blocks the path.", "\"To find the Golden Acorn in the center,\" says Scraps, \"you must answer my questions about FORCES: pushes, pulls, magnets, and friction!\""], "outro": ["You made it to the center of the maze! Scraps tips his straw hat and hands you Golden Acorn number three.", "WHOOSH! Another gust of wind rustles the corn. Pip points to an old red building. \"That's the Storybook Shed! I bet an acorn blew inside.\""], "questions": [{"type": "mc", "prompt": "Pip leans against a wagon full of pumpkins and moves it AWAY from himself. What force is Pip using?", "choices": ["No force at all", "A pull", "A magnet", "A push"], "hints": ["Think about the direction. Is the wagon moving toward Pip or away from him?", "Imagine opening a door. Which force do you use when the door moves away from you?"], "a": "aHN1cCBB"}, {"type": "mc", "prompt": "Pip grabs the wagon's handle and walks forward, so the wagon follows TOWARD him. What force is Pip using?", "choices": ["A magnet", "A pull", "Friction", "A push"], "hints": ["Which way is the wagon moving: toward Pip, or away from him?", "Think about how you move a backpack on wheels behind you."], "a": "bGx1cCBB"}, {"type": "mc", "prompt": "Pip pulls the wagon on two paths: a smooth sidewalk and a bumpy gravel path. Which path has MORE friction?", "choices": ["Both paths have the same friction", "The bumpy gravel path", "The smooth sidewalk", "Neither path has friction"], "hints": ["Friction is a force that happens when two surfaces rub against each other.", "Which surface would rub against the wheels more: rough or smooth?"], "a": "aHRhcCBsZXZhcmcgeXBtdWIgZWhU"}, {"type": "mc", "prompt": "Pip rolls a ball across the grass. The ball slows down and stops. Which force made it stop?", "choices": ["Friction", "A push from the wind", "No force made it stop", "Magnetism"], "hints": ["Something was rubbing against the ball the whole time it rolled.", "What force happens when the ball rubs against the grass?"], "a": "bm9pdGNpckY="}, {"type": "mc", "prompt": "Scraps holds up a magnet. Which object will the magnet pull toward it?", "choices": ["A wooden spoon", "A pumpkin seed", "A steel paper clip", "A plastic cup"], "hints": ["Magnets only attract certain metals, like iron and steel.", "Wood, plastic, and seeds are not metal. Which choice is made of metal?"], "a": "cGlsYyByZXBhcCBsZWV0cyBB"}, {"type": "mc", "prompt": "Pip holds two magnets so the NORTH end of one faces the NORTH end of the other. What will happen?", "choices": ["They will pull together (attract)", "Nothing will happen", "They will push apart (repel)", "The magnets will get heavier"], "hints": ["Remember the magnet rule: opposite poles attract.", "North and North are the SAME, not opposite. What do same poles do?"], "a": "KWxlcGVyKCB0cmFwYSBoc3VwIGxsaXcgeWVoVA=="}, {"type": "mc", "prompt": "Which change would make the wagon HARDER for Pip to pull?", "choices": ["Pulling it on a smoother path", "Taking pumpkins out of the wagon", "Putting oil on the wheels", "Adding more pumpkins to the wagon"], "hints": ["Think about what makes things easier or harder to move.", "Is a heavy object or a light object harder to pull?"], "a": "bm9nYXcgZWh0IG90IHNuaWtwbXVwIGVyb20gZ25pZGRB"}]}, {"id": "shed", "title": "The Storybook Shed", "icon": "📚", "skill": "Characters, setting, plot", "intro": ["Inside the Storybook Shed, a dusty old book is glowing on the shelf. The Golden Acorn is locked inside its cover!", "To open the book, read the story and answer questions about its characters, setting, and plot."], "passage": {"title": "The Missing Pie", "kind": "Story", "paras": ["On Thanksgiving morning, Mia and her little brother Leo hurried into Grandpa's warm, cozy kitchen. The whole room smelled like cinnamon. Grandpa had set a pumpkin pie on the windowsill to cool.", "But when Mia went to check on it, the pie was gone! \"Who took the pie?\" gasped Leo.", "The children looked under the table. They looked behind the door. Then Mia spotted a trail of orange crumbs on the floor. They followed the crumbs out the back door to the porch.", "There sat Grandpa's dog, Biscuit, with orange pumpkin filling on his nose! Grandpa laughed. \"Well, I guess we'll bake a new pie together!\"", "So Mia, Leo, and Grandpa spent the morning baking. This time, they put the pie up high on the counter."]}, "outro": ["The glowing book flips open. Tucked between the pages is Golden Acorn number four!", "Pip flaps his wings. \"More than halfway there! Look, the wind is blowing leaves toward the Apple Orchard!\""], "questions": [{"type": "mc", "prompt": "Who are the main characters in the story?", "choices": ["Mia and Leo", "Biscuit and a cat", "Grandma Hazel and Farmer Joe", "Pip and Scraps"], "hints": ["Characters are the people or animals a story is mostly about.", "Reread the very first sentence of the story. Who hurried into the kitchen?"], "a": "b2VMIGRuYSBhaU0="}, {"type": "mc", "prompt": "What is the SETTING of the story?", "choices": ["A snowy forest in winter", "A school on a Monday afternoon", "A pumpkin patch at night", "Grandpa's kitchen on Thanksgiving morning"], "hints": ["The setting is WHERE and WHEN a story happens.", "Look for clue words about the place and the time in the first sentence."], "a": "Z25pbnJvbSBnbml2aWdza25haFQgbm8gbmVoY3RpayBzJ2FwZG5hckc="}, {"type": "mc", "prompt": "What is the PROBLEM in the story?", "choices": ["The pumpkin pie is missing", "Leo is sick", "Biscuit ran away from home", "Grandpa forgot to buy pumpkins"], "hints": ["The problem is what goes wrong that the characters need to fix.", "What made Leo gasp?"], "a": "Z25pc3NpbSBzaSBlaXAgbmlrcG11cCBlaFQ="}, {"type": "mc", "prompt": "What did the children do right AFTER they found out the pie was gone?", "choices": ["They found Biscuit on the porch", "They baked a new pie", "They ate Thanksgiving dinner", "They looked under the table"], "hints": ["Find the part where Leo gasps. What happens in the very next part?", "\"Right after\" means the very next thing, not something that happened later."], "a": "ZWxiYXQgZWh0IHJlZG51IGRla29vbCB5ZWhU"}, {"type": "mc", "prompt": "How is the problem SOLVED at the end of the story?", "choices": ["They learn Biscuit ate the pie, so they bake a new one", "Leo buys a pie at the store", "They find the pie hiding in the oven", "Grandpa cancels Thanksgiving"], "hints": ["The solution is how the problem gets fixed at the end of the story.", "Reread the last two parts of the story."], "a": "ZW5vIHdlbiBhIGVrYWIgeWVodCBvcyAsZWlwIGVodCBldGEgdGl1Y3NpQiBucmFlbCB5ZWhU"}, {"type": "order", "prompt": "Put the events of the story's plot in order. Tap the event that happened FIRST, then the next, all the way to the LAST.", "items": ["They found Biscuit with filling on his nose.", "The children followed a trail of crumbs.", "Grandpa set the pie on the windowsill to cool.", "Mia found out the pie was gone.", "Everyone baked a new pie together."], "hints": ["Think about the beginning, middle, and end of the story.", "Reread the story one part at a time. What happens first?", "The problem comes before the solution."], "a": "LnJlaHRlZ290IGVpcCB3ZW4gYSBkZWthYiBlbm95cmV2RQouZXNvbiBzaWggbm8gZ25pbGxpZiBodGl3IHRpdWNzaUIgZG51b2YgeWVoVAouc2JtdXJjIGZvIGxpYXJ0IGEgZGV3b2xsb2YgbmVyZGxpaGMgZWhUCi5lbm9nIHNhdyBlaXAgZWh0IHR1byBkbnVvZiBhaU0KLmxvb2Mgb3QgbGxpc3dvZG5pdyBlaHQgbm8gZWlwIGVodCB0ZXMgYXBkbmFyRw=="}]}, {"id": "orchard", "title": "The Apple Orchard", "icon": "🍎", "skill": "Central idea (nonfiction)", "intro": ["In the Apple Orchard, the Golden Acorn is stuck at the very top of the tallest tree.", "Owlbert, a wise old owl, will drop it down to you, but only if you can find the CENTRAL IDEA of his two nonfiction articles.", "Remember: the central idea is what the WHOLE text is mostly about. Details are facts that support it."], "passage": {"title": "Owlbert's Articles", "kind": "Nonfiction", "sections": [{"title": "Article 1: Wild Turkeys, Built to Survive", "paras": ["Wild turkeys have bodies that are built to keep them safe in the forest. Their brown and bronze feathers help them blend in with trees and leaves, so it is hard for predators to see them.", "Wild turkeys have strong legs and can run up to 25 miles per hour. Even though they are big, they can fly short distances. At night, they fly up into trees to sleep safely.", "Wild turkeys also have sharp eyes that help them spot danger from far away."]}, {"title": "Article 2: Pumpkins Are Useful", "paras": ["Pumpkins can be used in many different ways. People carve them into jack-o'-lanterns. Cooks use pumpkin to make pies, breads, and soups.", "Farmers sometimes feed pumpkins to animals like pigs and cows. Even the seeds can be roasted and eaten as a crunchy snack."]}]}, "outro": ["\"Whoo-hoo! You found the central ideas!\" hoots Owlbert. A Golden Acorn drops from the treetop right into Pip's wings. That's five!", "Pip sniffs the air. \"I smell cranberries... The next acorn must be in the Cranberry Bog!\""], "questions": [{"type": "mc", "prompt": "Article 1: What is the CENTRAL IDEA of \"Wild Turkeys, Built to Survive\"?", "choices": ["Wild turkeys have brown feathers", "Wild turkeys can run 25 miles per hour", "Wild turkeys have body features that help keep them safe", "People eat turkey on Thanksgiving"], "hints": ["The central idea is what the WHOLE article is mostly about, not just one sentence.", "Two choices are only small details. One choice is not in the article at all.", "Which choice could be a title for the whole article?"], "a": "ZWZhcyBtZWh0IHBlZWsgcGxlaCB0YWh0IHNlcnV0YWVmIHlkb2IgZXZhaCBzeWVrcnV0IGRsaVc="}, {"type": "mc", "prompt": "Article 1: Which DETAIL supports the central idea?", "choices": ["Wild turkeys only live in zoos", "Their feathers help them blend in with trees and leaves", "Turkeys like to eat pumpkin pie", "Turkeys sleep in barns with cows"], "hints": ["A supporting detail is a fact that comes FROM the article.", "Which choice tells how a turkey's body helps it stay safe?"], "a": "c2V2YWVsIGRuYSBzZWVydCBodGl3IG5pIGRuZWxiIG1laHQgcGxlaCBzcmVodGFlZiByaWVoVA=="}, {"type": "mc", "prompt": "Article 1: Why do wild turkeys fly up into trees at night?", "choices": ["To talk with owls", "To build nests out of snow", "To pick apples", "To sleep safely"], "hints": ["Find the sentence in the article that talks about night.", "Reread the second paragraph of Article 1."], "a": "eWxlZmFzIHBlZWxzIG9U"}, {"type": "mc", "prompt": "Article 2: What is the CENTRAL IDEA of \"Pumpkins Are Useful\"?", "choices": ["Pumpkins can be used in many different ways", "Pumpkins grow in the fall", "Pumpkin seeds make a crunchy snack", "Pigs and cows eat pumpkins"], "hints": ["Is the article mostly about ONE way to use pumpkins, or lots of ways?", "Two choices are small details. One choice isn't in the article at all."], "a": "c3lhdyB0bmVyZWZmaWQgeW5hbSBuaSBkZXN1IGViIG5hYyBzbmlrcG11UA=="}, {"type": "mc", "prompt": "Article 2: Which is a supporting DETAIL from the article?", "choices": ["Nobody likes to eat pumpkins", "Pumpkins are the biggest fruit in the world", "Cooks use pumpkin to make pies, breads, and soups", "Pumpkins are too heavy to carve"], "hints": ["A supporting detail must come FROM the article.", "Reread Article 2. Which choice do you see in the text?"], "a": "c3B1b3MgZG5hICxzZGFlcmIgLHNlaXAgZWthbSBvdCBuaWtwbXVwIGVzdSBza29vQw=="}]}, {"id": "bog", "title": "The Cranberry Bog", "icon": "🫐", "skill": "Sequence text structure", "intro": ["The Cranberry Bog is flooded with water and covered with floating red berries. The Golden Acorn is bobbing somewhere in the middle!", "Bella the beaver can swim out to get it. But first she wants to know if you understand how this article is organized."], "passage": {"title": "How Cranberries Are Harvested", "kind": "Nonfiction", "paras": ["Cranberries grow on low vines in sandy fields called bogs. In the fall, many farmers harvest them in a special way.", "First, farmers flood the bog with water. Next, they drive machines called water reels through the bog. The machines shake the berries loose from the vines.", "Then, the cranberries float to the top of the water because they have tiny pockets of air inside. After that, workers use long floating fences called booms to push the berries together.", "Finally, the berries are pumped onto trucks and taken away to be cleaned."]}, "outro": ["Bella the beaver paddles out and brings back Golden Acorn number six, dripping wet and shining!", "\"Just one more!\" says Pip. \"The last acorn blew into the Farmers' Market. Hurry, the sun is starting to set!\""], "questions": [{"type": "mc", "prompt": "What text structure does the author use in \"How Cranberries Are Harvested\"?", "choices": ["Sequence: it tells steps in order", "Cause and effect: it tells why one thing made another thing happen", "Compare and contrast: it tells how two things are alike and different", "Problem and solution: it tells about a problem and how it was fixed"], "hints": ["Look at the first word of many sentences: First... Next... Then...", "What kind of text tells events or steps in the order they happen?"], "a": "cmVkcm8gbmkgc3BldHMgc2xsZXQgdGkgOmVjbmV1cWVT"}, {"type": "mc", "prompt": "Which words are SIGNAL WORDS that show a sequence text structure?", "choices": ["Alike, Different, Both", "Because, So, Since", "First, Next, Finally", "Big, Red, Round"], "hints": ["Signal words help you know the ORDER things happen.", "Look back at the article. Which of these words can you find at the start of sentences?"], "a": "eWxsYW5pRiAsdHhlTiAsdHNyaUY="}, {"type": "mc", "prompt": "What happens right AFTER farmers flood the bog?", "choices": ["Machines shake the berries loose", "The berries are pumped onto trucks", "The berries are cleaned", "Booms push the berries together"], "hints": ["Find the sentence that starts with \"First.\" Then read the next sentence.", "Look for the signal word \"Next\" in the article."], "a": "ZXNvb2wgc2VpcnJlYiBlaHQgZWthaHMgc2VuaWhjYU0="}, {"type": "order", "prompt": "Put the steps of the cranberry harvest in order. Tap the FIRST step, then the next, all the way to the LAST step.", "items": ["Booms push the berries together.", "The berries are pumped onto trucks.", "The berries float to the top.", "Machines shake the berries loose.", "Farmers flood the bog with water."], "hints": ["Use the signal words in the article: First, Next, Then, After that, Finally.", "Find the step that goes with the word \"First.\" Then find \"Next.\"", "The step with \"Finally\" goes last."], "a": "LnNrY3VydCBvdG5vIGRlcG11cCBlcmEgc2VpcnJlYiBlaFQKLnJlaHRlZ290IHNlaXJyZWIgZWh0IGhzdXAgc21vb0IKLnBvdCBlaHQgb3QgdGFvbGYgc2VpcnJlYiBlaFQKLmVzb29sIHNlaXJyZWIgZWh0IGVrYWhzIHNlbmloY2FNCi5yZXRhdyBodGl3IGdvYiBlaHQgZG9vbGYgc3JlbXJhRg=="}, {"type": "order", "prompt": "Bella is making cranberry sauce for the feast! Put her recipe steps in order.", "items": ["Let the sauce cool down.", "Put the berries, water, and sugar in a pot.", "Serve the sauce at the feast.", "Wash the cranberries.", "Cook until the berries pop."], "hints": ["Think about what has to happen before you can cook something.", "Can you serve the sauce before it is cooked? What must come last?", "Try saying the steps out loud with First, Next, Then, After that, Finally."], "a": "LnRzYWVmIGVodCB0YSBlY3VhcyBlaHQgZXZyZVMKLm53b2QgbG9vYyBlY3VhcyBlaHQgdGVMCi5wb3Agc2VpcnJlYiBlaHQgbGl0bnUga29vQwoudG9wIGEgbmkgcmFndXMgZG5hICxyZXRhdyAsc2VpcnJlYiBlaHQgdHVQCi5zZWlycmVibmFyYyBlaHQgaHNhVw=="}]}, {"id": "market", "title": "The Farmers' Market", "icon": "🥧", "skill": "3-digit subtraction", "intro": ["The Farmers' Market is busy with shoppers. Mr. Ortiz runs the pie stand, and he found the last Golden Acorn!", "He will trade it to you if you help him figure out his numbers. Be careful: some of these problems need regrouping!"], "outro": ["Mr. Ortiz smiles and hands you the seventh Golden Acorn. \"Thanks for your help, math expert!\"", "Pip does a happy turkey dance. \"We have all seven! Quick, to the Feast Barn before the dinner bell rings!\""], "questions": [{"type": "num", "prompt": "Solve: 586 − 243", "say": "Solve. 586 minus 243.", "stack": ["586", "243", "−"], "errs": {"829": "This is a subtraction problem. Make sure you are subtracting, not adding."}, "hints": ["Start with the ones place: 6 − 3.", "Next subtract the tens, then the hundreds.", "Check each column again: ones, tens, hundreds."], "a": "MzQz"}, {"type": "num", "prompt": "Solve: 652 − 327", "say": "Solve. 652 minus 327.", "stack": ["652", "327", "−"], "errs": {"335": "Look at the ones: 2 − 7. You can't take 7 from 2, so regroup a ten first. After you regroup, the tens place has one less ten!", "979": "This is a subtraction problem. Make sure you are subtracting, not adding."}, " ", "P|Picture a number line from 40 to 50. Where would 47 be? Which end is closer?": "26a19d01c2f7.mp3", "P|76 is a two-digit number. It is less than 100! Which hundreds is it between?": "197ba52fe778.mp3", "O|Two choices are only small details. One choice is not in the article at all.": "6664ec67bb8c.mp3", "B|Use the signal words in the article: First, Next, Then, After that, Finally.": "0675718bfaa4.mp3", "M|The word \"left\" means some pies were taken away. Should you add or subtract?": "8fd5fb503507.mp3", "P|We found one Golden Acorn! Tap the glowing stop to head to the Pumpkin Patch!": "97d58fcf7efd.mp3", "P|More than halfway there! The wind is blowing leaves toward the Apple Orchard!": "ff7258a48fc8.mp3", "B|Bella is making cranberry sauce for the feast! Put her recipe steps in order.": "04f614732960.mp3", "P|The sign says there are 47 pumpkins in the patch. Round 47 to the nearest ten.": "bc571f38da7c.mp3", "P|Look at the ones: 6 + 8 is more than 9. Regroup a ten into the tens column!": "71842266b5b8.mp3", "P|You're amazing! But look, the wind blew the next acorn deep into the Corn Maze!": "ee42f8b919be.mp3", "P|The words \"in all\" mean we put the groups together. Should you add or subtract?": "475c1e2b746f.mp3", "P|Both the ones AND the tens add up to more than 9. You need to regroup two times!": "ca1cd2e7d5f0.mp3", "P|Four acorns! More than halfway there! Tap the glowing stop for the Apple Orchard!": "89fe51130c18.mp3", "P|Five acorns! I can smell cranberries. Tap the glowing stop for the Cranberry Bog!": "49eb783a01a2.mp3", "P|You regrouped the ones. Now check the tens: 8 + 4 + 1. Is that more than 9?": "580086e91d8e.mp3", "S|Imagine opening a door. Which force do you use when the door moves away from you?": "f600f92bae7a.mp3", "M|When you regroup across zeros, the tens place becomes 9, not 10. Check your tens.": "8038f6f23d65.mp3", "P|Look at the ones digit: 3. Is 3 five or more? If it is less than 5, we round down.": "5e252e10729b.mp3", "P|Check the ones place. 8 + 7 makes a new ten. Did you carry it over to the tens?": "a6238871feb4.mp3", "O|The central idea is what the WHOLE article is mostly about, not just one sentence.": "9b74ac8bcfbc.mp3", "P|Look at the ones: 7 + 6 is more than 9. Regroup! Then check the tens column too.": "1b5617aa71cb.mp3", "P|Two acorns! The sun is getting lower. Tap the glowing stop to go into the Corn Maze!": "be96bf10df4e.mp3", "P|We are rounding to the nearest TEN, not the nearest hundred. Look at the tens place.": "ec3cf2acee9b.mp3", "M|Trade 1 hundred for 10 tens. Then trade 1 ten for 10 ones. Now subtract each column.": "670eb6e3269c.mp3", "P|That's the nearest ten. Rounding to the nearest HUNDRED means your answer ends in 00.": "2da60b08ad07.mp3", "P|You regrouped the ones. Now look at the tens: is that sum more than 9? Regroup again!": "be429abdda12.mp3", "M|3 hundreds → 2 hundreds and 10 tens. Then 10 tens → 9 tens and 10 ones. Now subtract.": "d87cf02a318f.mp3", "P|Gobble-gobble! Happy Thanksgiving! Thanks for being the best helper on the whole farm!": "29d94eb2141a.mp3", "B|Look back at the article. Which of these words can you find at the start of sentences?": "d4a73b7b68d2.mp3", "P|Wait, there's one last lock! The sign says: Solve the final riddle to enter the feast!": "7470a08748f3.mp3", "P|We are rounding to the nearest TEN. Your answer should be a ten, like 30, 40, 50, or 60.": "f1c0bdcb3abd.mp3", "S|Pip rolls a ball across the grass. The ball slows down and stops. Which force made it stop?": "d871cf2ab9c2.mp3", "P|Golden Acorn number five! I smell cranberries. The next acorn must be in the Cranberry Bog!": "5be74ce0f069.mp3", "P|Watch out! When the tens column makes 10 tens, that's 1 hundred. Regroup it to the hundreds.": "bd59cee8a18b.mp3", "P|Acorn number three! Look, an acorn blew into that old red building. It's the Storybook Shed!": "485b30540f66.mp3", "M|When you regroup from the hundreds, 3 hundreds becomes 2 hundreds. Check your hundreds place.": "2b3dd1993e37.mp3", "M|Pip had 300 pumpkin seeds. He gave 145 seeds to his friends. How many seeds does Pip have now?": "69feff6de2c8.mp3", "P|Gobble-gobble, oh no! Without the Golden Acorns, nobody can open the barn. No feast for anyone!": "0595d7383ece.mp3", "M|After you regroup a ten into the ones, the tens place has one less ten. Check your tens column.": "9163e4c40080.mp3", "M|Careful! 4 − 8: the top number is smaller. You need to regroup. Don't just flip the numbers!": "f8e58949d46c.mp3", "M|Careful! 0 − 5: the top number is smaller. You need to regroup. Don't just flip the numbers!": "ecfdbd034c07.mp3", "P|That's rounding to the nearest ten. Rounding to the nearest HUNDRED means your answer ends in 00.": "42d681e486b3.mp3", "P|Look at the tens: 0 + 9 + 1 makes 10 tens. 10 tens is the same as 1 hundred. Regroup again!": "8ffe20aa4afc.mp3", "S|Pip holds two magnets so the NORTH end of one faces the NORTH end of the other. What will happen?": "18ece3907af4.mp3", "M|When you regroup from the hundreds, the 5 hundreds becomes 4 hundreds. Check your hundreds place.": "0aa2673ca530.mp3", "H|Pip! And my new friend! You found every Golden Acorn. You saved Thanksgiving at Maple Hollow Farm!": "dd4bd3a6bc00.mp3", "S|Pip leans against a wagon full of pumpkins and moves it AWAY from himself. What force is Pip using?": "fcc98a252a7a.mp3", "P|That's six! Just one more. The last acorn blew into the Farmers' Market. Hurry, the sun is setting!": "3665a960fd16.mp3", "P|Farmer Joe picked 476 apples on Monday and 318 apples on Tuesday. How many apples did he pick in all?": "6524e9c5f11e.mp3", "O|Remember: the central idea is what the WHOLE text is mostly about. Details are facts that support it.": "63b7ca2c58e5.mp3", "P|We have all seven Golden Acorns! The sun is almost down. Tap the glowing stop to run to the Feast Barn!": "23e698b8a1f8.mp3", "S|Pip grabs the wagon's handle and walks forward, so the wagon follows TOWARD him. What force is Pip using?": "8e5ae2bd7eb4.mp3", "P|To open the book, we /* ---------- backdrop by time of day ---------- */
function backdrop(t, opts = {}){
  const top = lerpKeys([[0,'#79C3EC'],[.4,'#9CC9E0'],[.62,'#F0B36E'],[.82,'#E9775A'],[1,'#4A3A78']], t);
  const bot = lerpKeys([[0,'#DFF2FA'],[.4,'#F6E7C8'],[.62,'#FBE0A6'],[.82,'#F9C27C'],[1,'#EE8B5E']], t);
  const sunC = lerpKeys([[0,'#FFF6C8'],[.6,'#FFD26A'],[1,'#FF7A3C']], t);
  const hillF = lerpKeys([[0,'#9EBF79'],[.6,'#B4A86E'],[1,'#6E5E7A']], t);
  const hillN = lerpKeys([[0,'#ADC86A'],[.6,'#B9AE5E'],[1,'#7E6A5E']], t);
  const id = 'sky' + (++uid);
  const sunY = 80 + t * 250;
  let stars = '';
  if (t > .85) for (let i = 0; i < 26; i++) stars += `<circle cx="${rnd()*1200}" cy="${rnd()*200}" r="${1 + rnd()*1.8}" fill="#fff" class="twinkle" style="animation-delay:${rnd()*3}s"/>`;
  return `
  <linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>
  <rect width="1200" height="540" fill="url(#${id})"/>${stars}
  <circle cx="${opts.sunX || 960}" cy="${sunY}" r="110" fill="${sunC}" opacity=".25" filter="url(#fSoft)"/>
  <circle cx="${opts.sunX || 960}" cy="${sunY}" r="48" fill="${sunC}"/>
  ${cloud(140, 70, .9, 80, 10)}${cloud(600, 50, .7, 110, 40)}${cloud(1000, 110, .6, 95, 70)}
  <g class="birds"><path d="M0 0 q8 -8 16 0 q8 -8 16 0" stroke="#3a2a3a" stroke-width="2.5" fill="none"/><path d="M30 18 q6 -6 12 0 q6 -6 12 0" stroke="#3a2a3a" stroke-width="2" fill="none"/></g>
  <path d="M0 300 C 160 240 300 270 440 250 C 600 228 760 270 900 245 C 1020 225 1120 250 1200 240 V540 H0Z" fill="${hillF}"/>
  ${opts.noNear ? '' : `<path d="M0 340 C 200 300 380 330 560 310 C 760 290 960 330 1200 300 V540 H0Z" fill="${hillN}"/>`}`;
}

<script>/* ===================== GAME ENGINE ===================== */
(() => {
'use strict';
const D = DATA, AUD = AUDIO, T = STORY;
const STAGES = D.rooms.concat([D.final]);
const NR = D.rooms.length; // 7
const KEY = 'maplehollow-escape-v2';
const TOD = [.06, .2, .32, .45, .56, .68, .8, .94];
const SCENE_OF = ['gate','pumpkins','maze','shed','orchard','bog','market','barn'];

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const dec = s => { const b = atob(s); return Array.from(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)))).reverse().join(''); };
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)){ if (k == null || k === false) continue; e.append(k.nodeType ? k : document.createTextNode(String(k))); }
  return e;
}
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let epoch = 0;
const E = { out: p => 1 - Math.pow(1 - p, 3), io: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2, lin: p => p, back: p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); } };
function tween(ms, fn, ease = E.io){ const ep = epoch; return new Promise(res => { const t0 = performance.now(); const tick = now => { if (ep !== epoch) return res(false); const p = Math.min(1, (now - t0) / ms); fn(ease(p), p); if (p < 1) requestAnimationFrame(tick); else res(true); }; requestAnimationFrame(tick); }); }
const sleep = ms => { const ep = epoch; return new Promise(r => setTimeout(() => r(ep === epoch), ms)); };
const live = ep => ep === epoch;

/* ---------- state ---------- */
const fresh = () => ({ step: 'cine', r: 0, q: 0, k: 0, name: '', started: null, finished: null });
function load(){ try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && v.step && v.r <= NR) return v; } catch(e){} return null; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
let S = load() || fresh();

/* ---------- sound effects (synthesized, no files) ---------- */
const SFX = (() => {
  let ctx = null, on = true;
  try { on = localStorage.getItem('mh-sfx') !== 'off'; } catch(e){}
  const C = () => { if (!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  function tone(f, dur, { type = 'sine', vol = .18, at = 0, to = null, attack = .01 } = {}){
    const c = C(); if (!c || !on) return; const t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  function noise(dur, { f = 800, q = 1, vol = .2, at = 0, sweep = null } = {}){
    const c = C(); if (!c || !on) return; const t = c.currentTime + at;
    const b = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = b; const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.setValueAtTime(f, t); if (sweep) fl.frequency.exponentialRampToValueAtTime(sweep, t + dur); fl.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * .3); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(fl).connect(g).connect(c.destination); s.start(t);
  }
  return {
    get on(){ return on; }, set on(v){ on = v; try { localStorage.setItem('mh-sfx', v ? 'on' : 'off'); } catch(e){} },
    unlock: () => C(),

const player = new Audio(); player.preload = 'auto';

function setTalking(who, on){

}
function stopVoice(){
  playTok++; player.pause(); try { speechSynthesis.cancel(); } catch(e){}
  document.querySelectorAll('.talking').forEach(n => n.classList.remove('talking'));
  if (activeBtn){ activeBtn.classList.remove('speaking'); activeBtn = null; }
}
function playOne(item, tok){
  return new Promise(res => {
    if (tok !== playTok) return res();
    const f = AUD[item.who + '|' + item.text];
    setTalking(item.who, true);
    const done = () => { setTalking(item.who, false); res(); };
    if (f){
      player.src = 'audio/' + f; player.onended = done; player.onerror = () => fallback(item, done);
      player.play().catch(() => fallback(item, done));
    } else fallback(item, done);
  });
}
function fallback(item, done){

}
async function speak(items, btn){

  const tok = playTok; activeBtn = btn; btn && btn.classList.add('speaking');

  if (tok === playTok && btn){ btn.classList.remove('speaking'); activeBtn = null; }
}

  if (id === 'gate'){
    progress(r, 6, false); SFX.creak(); sq('#cam').classList.add('open');
    const roll = sq('#rollStage'); const g = svgG(ART.acorn(0, 0, .45)); roll.append(g); SFX.pop();
    await tween(1600, p => g.setAttribute('transform', `translate(${600 + p * 0},${346 + p * 120}) rotate(${p * 540}) scale(${.3 + p * .7})`), E.out);
  } else if (id === 'pumpkins'){
    SFX.gear(); sq('.machine').classList.add('spinning'); const lf = sq('#lifter');
    await tween(1800, p => lf.setAttribute('transform', `translate(0,${-25 - p * 110})`), E.io);
    sq('.machine').classList.remove('spinning'); const h = sq('#hiddenAcorn'); h.setAttribute('opacity', 1); h.classList.add('popin'); SFX.sparkle();
  } else if (id === 'maze'){
    const d = sq('#demo'); d && (d.innerHTML = ''); sq('#mazeWall').classList.add('open', 'wide'); SFX.whoosh(1);
    await sleep(700); const a = sq('#mazeAcorn'); a.setAttribute('opacity', 1); a.classList.add('popin'); SFX.sparkle(); charClass('.scraps', 'cheer', 2000);
  } else if (id === 'shed'){
    progress(r, 6, false); SFX.page(); const b = sq('#book'); b.querySelector('.book-closed').setAttribute('opacity', 0); b.querySelector('.book-open').setAttribute('opacity', 1);
    const a = sq('#bookAcorn'); a.setAttribute('opacity', 1); SFX.sparkle();
    await tween(1400, p => a.setAttribute('transform', `translate(0,${-p * 60})`), E.out);
  } else if (id === 'orchard'){
    const a = sq('#treeAcorn'); SFX.whoosh(.6); charClass('.owl', 'cheer', 2000);
    await tween(1300, p => a.setAttribute('transform', `translate(${-p * 440},${p * p * 300})`), E.lin); SFX.pop(); charClass('.pip', 'cheer', 1500);
  } else if (id === 'bog'){
    const bg = sq('#bella'), ac = sq('#bogAcorn'); bg.style.transform = 'translateX(470px)'; SFX.splash(); await sleep(1300);
    bg.style.transform = 'translateX(80px)'; ac.style.transition = 'transform 1.2s ease-in-out'; ac.style.transform = 'translateX(-390px)'; SFX.splash(); await sleep(1300); charClass('.beaver', 'cheer', 1500);
  } else if (id === 'market'){
    const a = sq('#marketAcorn'); a.setAttribute('opacity', 1); a.classList.add('popin'); SFX.sparkle(); charClass('.char[data-who="M"]', 'cheer', 2000);
    await tween(1000, p => a.setAttribute('transform', `translate(0,${-p * 30})`), E.out);
  }
  confetti(18);
  await sleep(500);
  flyAcornToSlot(r);
}
function vOutro(){
  const r = S.r, st = STAGES[r], talk = T.ROOM_TALK[st.id];
  roomScene(r); progress(r, st.questions.length, false);
  if (S.k === 0) reward(r); else { renderTracker(); }
  clearPanel();
  const [who, text] = talk.outro[S.k];
  const last = S.k === talk.outro.length - 1;
  { const bn = $('#banner'); bn.className = 'show acornb'; bn.append(el('span', { html: `<svg viewBox="-50 -50 100 100" width="44" height="44">${ART.DEFS}${ART.acorn(0, 0, .95)}</svg>` }), `Golden Acorn ${r + 1} of ${NR} found!`); }
  panel.append(
    dialogue(who, text, [btn(last ? 'Back to the farm map 🗺️' : 'Next ▶', () => { if (last){ S.r++; S.q = 0; S.k = 0; S.step = 'map'; wipe(); setTimeout(render, 350); } else { S.k++; render(); } })]));
}

/* ---- finale ---- */
async function vFinale(){
  const k = S.k, [beat, who, text] = T.FINALE_SHOTS[k];
  clearPanel();
  const last = k === T.FINALE_SHOTS.length - 1;
  panel.append(dialogue(who, text, [btn(last ? 'See my award 🏆' : 'Next ▶', () => { if (last){ S.step = 'done'; } else S.k++; render(); })]));
  if (beat === 'open'){
    setScene('finale-open', ART.S.barn(.97, { filled: true, pipX: 380 }));
    progress(NR, 4, false); await sleep(400); SFX.bell(); await sleep(900); SFX.creak();
    sq('#cam').classList.add('barn-open'); const l = sq('#barnLight'); await tween(1500, p => l && l.setAttribute('opacity', p), E.io);
  } else {
    if (setScene('feast', ART.S.feast())) { SFX.fanfare(); confetti(40); }
    if (beat === 'hazel') charClass('.char[data-who="H"]', 'cheer', 1500);
    if (beat === 'party'){ stage.querySelectorAll('.char').forEach(c => c.classList.add('cheer-loop')); confetti(40); SFX.fanfare(); }
  }
}
function vDone(){
  setScene('feast', ART.S.feast()); stage.querySelectorAll('.char').forEach(c => c.classList.add('cheer-loop'));
  confetti(50); SFX.fanfare();
  clearPanel();
  const mins = (S.started && S.finished) ? Math.max(1, Math.round((S.finished - S.started) / 60000)) : null;
  const today = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  panel.append(el('div', { class: 'cert' },
    el('div', { class: 'cert-acorns', html: Array.from({ length: 7 }, () => `<svg viewBox="-50 -50 100 100" width="40" height="40">${ART.DEFS}${ART.acorn(0, 0, .95)}</svg>`).join('') }),
    el('div', { class: 'cert-kicker' }, 'Thanksgiving Hero Award'),
    el('div', { class: 'cert-name' }, S.name || 'Super Solver'),
    el('p', { class: 'cert-line' }, 'found all 7 Golden Acorns and saved the feast at Maple Hollow Farm!'),
    el('ul', { class: 'cert-skills' }, D.rooms.map(rm => el('li', null, rm.icon, ' ', rm.skill))),
    el('p', { class: 'cert-date' }, today, mins ? ` · about ${mins} minute${mins === 1 ? '' : 's'}` : ''),
    el('p', { class: 'cert-show' }, sayBtn([W('N', T.UI_LINES.cert)]), el('span', null, '📸 Show this screen to your teacher!'))));
}

/* ---------- boot ---------- */
$('#restart').addEventListener('click', () => { if (confirm('Start the whole escape room over? Progress on this device will be erased.')){ S = fresh(); sceneKey = ''; render(); } });
const sb = $('#sfxBtn');
const paintSfx = () => { sb.textContent = SFX.on ? '🔔 Sounds on' : '🔕 Sounds off'; sb.setAttribute('aria-pressed', SFX.on); };
sb.addEventListener('click', () => { SFX.on = !SFX.on; paintSfx(); });
paintSfx();
document.addEventListener('pointerdown', () => SFX.unlock(), { once: true });
render();
window.__mh = { get S(){ return S; } };
})();
</script>
